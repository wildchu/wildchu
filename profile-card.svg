<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920" width="100%" height="100%">
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#79103c" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0c12" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b2cf5" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#3a0ca3" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a0c12" stop-opacity="0" />
    </radialGradient>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font: 800 44px 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; fill: #ffffff; letter-spacing: 14px; }
      .role { font: 600 12px 'JetBrains Mono', 'Fira Code', monospace; fill: #ff2a4b; letter-spacing: 5px; }
      .subrole { font: 500 11px 'JetBrains Mono', 'Fira Code', monospace; fill: #d8b4fe; letter-spacing: 3px; }
      .techline { font: 500 10px 'JetBrains Mono', 'Fira Code', monospace; fill: #ff4d6d; letter-spacing: 2.5px; }
      .link { font: 400 11px 'JetBrains Mono', 'Fira Code', monospace; fill: #4b5563; letter-spacing: 1px; }
      .pill-text { font: 600 12px 'Segoe UI', sans-serif; }
      .stat-num { font: 800 30px 'Segoe UI', sans-serif; fill: #ffffff; }
      .stat-lbl { font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 2.5px; }
      .sec-hdr { font: 700 11px 'JetBrains Mono', monospace; fill: #ff3355; letter-spacing: 3.5px; }
      .lang-name { font: 600 12px 'Segoe UI', sans-serif; fill: #e5e7eb; }
      .lang-pct { font: 400 11px 'JetBrains Mono', monospace; fill: #6b7280; }
      .divider { stroke: #181c26; stroke-width: 1; }
